name: Actualiza Historial Mensual

on:
  workflow_dispatch: 

jobs:
  update-history:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Ejecutar Scripts (Ecowitt API)
        env:
          APP_KEY: ${{ secrets.ECOWITT_APPLICATION_KEY }}
          API_KEY: ${{ secrets.ECOWITT_API_KEY }}
          MAC: ${{ secrets.ECOWITT_STATION_MAC }}
          TZ: America/Argentina/Buenos_Aires
        run: |
          mkdir -p data
          python3 scripts/actualizar_mensual.py
          python3 scripts/lluvias_acumuladas.py
          python3 scripts/pronostico.py

      - name: Commit y Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Guardar temporalmente lo que generaron los scripts de Python
          git stash
          
          # Traer los cambios del remoto para estar al día
          git pull --rebase origin main
          
          # Restaurar los archivos modificados/creados por Python
          git stash pop || true
          
          # Agregamos todo en data/ y mandamos el commit/push
          git add data/*.json
          git commit -m "Clima Chacabuco: Actualización de datos" || echo "Sin cambios para commitear"
          git push origin main
name: Obtener Min y Max de Temperatura

on:
  workflow_dispatch: # Para correrlo a mano desde GitHub
  repository_dispatch:
    types: [update-weather] # Por si lo disparás desde cronjob.org con un webhook

permissions:
  contents: write # Clave para que GitHub Actions pueda pushear el nuevo JSON

jobs:
  get-temp:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Instalar requests
        run: pip install requests

      - name: Obtener datos de Ecowitt y armar maxmin.json
        env:
          APP_KEY: ${{ secrets.ECOWITT_APP_KEY }}
          API_KEY: ${{ secrets.ECOWITT_API_KEY }}
          MAC: ${{ secrets.ECOWITT_MAC }}
        run: |
          python -c "
          # No borramos los comentarios, maquinola.
          import os
          import requests
          import json
          from datetime import datetime, timedelta
          
          # Usamos UTC directo porque la API de Ecowitt trabaja en esa zona horaria
          now_utc = datetime.utcnow()
          
          # Redondeamos a la hora en punto para que el ciclo de 30min encaje perfecto
          # y armamos la ventana exacta de 24 horas hacia atrás
          end_date = now_utc.strftime('%Y-%m-%d %H:00:00')
          start_date = (now_utc - timedelta(hours=24)).strftime('%Y-%m-%d %H:00:00')
          
          # Traemos las credenciales desde los secrets
          app_key = os.environ.get('APP_KEY')
          api_key = os.environ.get('API_KEY')
          mac = os.environ.get('MAC')
          
          # LA POSTA: requests convierte los espacios de la fecha en '+', y Ecowitt 
          # a veces devuelve vacío por eso. Armamos la URL a mano forzando el '%20'.
          start_url = start_date.replace(' ', '%20')
          end_url = end_date.replace(' ', '%20')
          
          url = f'https://api.ecowitt.net/api/v3/device/history?application_key={app_key}&api_key={api_key}&mac={mac}&cycle=30min&temp_unitid=1&start_date={start_url}&end_date={end_url}&call_back=outdoor.temperature'
          
          response = requests.get(url)
          data = response.json()
          
          try:
              data_content = data.get('data')
              
              # Si no hay datos, la API devuelve una lista vacía. Lo atajamos acá:
              if isinstance(data_content, list) or not data_content:
                  print(f'No hay datos todavía. URL armada: start={start_date} end={end_date}')
                  exit(0) # Salimos limpio para que la Action no tire error
                  
              # Buscamos la lista de temperaturas de forma segura.
              if 'outdoor' in data_content and 'temperature' in data_content['outdoor']:
                  temp_data = data_content['outdoor']['temperature']['list']
              elif 'outdoor.temperature' in data_content:
                  temp_data = data_content['outdoor.temperature']['list']
              elif 'temperature' in data_content:
                  temp_data = data_content['temperature']['list']
              else:
                  print('Estructura del JSON no reconocida:', data_content)
                  exit(0)
              
              # Filtramos los valores válidos y los convertimos a float
              temperaturas = [float(v) for k, v in temp_data.items() if v is not None]
              
              if temperaturas:
                  t_min = min(temperaturas)
                  t_max = max(temperaturas)
                  print(f'Temperatura Mínima (últimas 24hs): {t_min}°C')
                  print(f'Temperatura Máxima (últimas 24hs): {t_max}°C')
                  
                  # Creamos el maxmin.json
                  datos_json = {'min': t_min, 'max': t_max}
                  with open('maxmin.json', 'w') as f:
                      json.dump(datos_json, f, indent=4)
                      
                  print('Archivo maxmin.json generado de 10.')
              else:
                  print('No se encontraron registros de temperatura.')
                  
          except Exception as e:
              print(f'Error al procesar los datos de la API: {e}')
              print('Respuesta cruda:', data)
          "

      - name: Hacer commit y push de maxmin.json
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Nos fijamos si el script de Python efectivamente creó el archivo
          if [ -f maxmin.json ]; then
            git add maxmin.json
            git commit -m "Actualizando maxmin.json [skip ci]" || echo "Sin cambios para commitear"
            git push
          else
            echo "El archivo maxmin.json no se generó. Salteando el commit para no romper nada."
          fi
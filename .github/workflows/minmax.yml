name: Min y Max de Temperatura

on:
  workflow_dispatch: # Para correrlo a mano desde GitHub
  repository_dispatch:
    types: [update-weather] # Por si lo disparás desde cronjob.org con un webhook

permissions:
  contents: write # Clave para que GitHub Actions pueda pushear el nuevo JSON

jobs:
  get-temp:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Instalar requests
        run: pip install requests

      - name: Obtener datos de Ecowitt y armar maxmin.json
        env:
          APP_KEY: ${{ secrets.ECOWITT_APP_KEY }}
          API_KEY: ${{ secrets.ECOWITT_API_KEY }}
          MAC: ${{ secrets.ECOWITT_MAC }}
        run: |
          python -c "
          # No borramos los comentarios, maquinola.
          import os
          import requests
          import json
          from datetime import datetime
          
          # Obtenemos la fecha actual para el inicio y fin del día
          today = datetime.now().strftime('%Y-%m-%d')
          start_date = f'{today} 00:00:00'
          end_date = f'{today} 23:59:59'
          
          # Traemos las credenciales desde los secrets
          app_key = os.environ.get('APP_KEY')
          api_key = os.environ.get('API_KEY')
          mac = os.environ.get('MAC')
          
          # Armamos la URL solo con lo necesario (call_back=outdoor.temperature)
          url = 'https://api.ecowitt.net/api/v3/device/history'
          params = {
              'application_key': app_key,
              'api_key': api_key,
              'mac': mac,
              'cycle': '30min',
              'temp_unitid': '1', # 1 es Celsius
              'start_date': start_date,
              'end_date': end_date,
              'call_back': 'outdoor.temperature'
          }
          
          response = requests.get(url, params=params)
          data = response.json()
          
          try:
              # Navegamos por la estructura JSON para sacar la lista de temperaturas
              temp_data = data['data']['outdoor']['temperature']['list']
              
              # Filtramos los valores válidos y los convertimos a float
              temperaturas = [float(v) for k, v in temp_data.items() if v is not None]
              
              if temperaturas:
                  t_min = min(temperaturas)
                  t_max = max(temperaturas)
                  print(f'Temperatura Mínima: {t_min}°C')
                  print(f'Temperatura Máxima: {t_max}°C')
                  
                  # Creamos el maxmin.json solo con estos dos datos
                  datos_json = {'min': t_min, 'max': t_max}
                  with open('maxmin.json', 'w') as f:
                      json.dump(datos_json, f, indent=4)
                      
                  print('Archivo maxmin.json generado joya.')
              else:
                  print('No se encontraron registros de temperatura para hoy.')
          except KeyError as e:
              print(f'Error al procesar los datos de la API: {e}')
              print('Respuesta cruda:', data)
          "

      - name: Hacer commit y push de maxmin.json
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add maxmin.json
          # Si no hay cambios, que no tire error y siga de largo
          git commit -m "Actualizando maxmin.json [skip ci]" || echo "Sin cambios para commitear"
          git push
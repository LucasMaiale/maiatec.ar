name: Actualizar Historial Mensual

on:
  # Disparador manual para que le pegue cronjob.org
  workflow_dispatch: 

jobs:
  update-history:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Ejecutar Scripts (Ecowitt API)
        env:
          # Pasamos los secretos como variables para que Python los consuma
          APP_KEY: ${{ secrets.ECOWITT_APPLICATION_KEY }}
          API_KEY: ${{ secrets.ECOWITT_API_KEY }}
          MAC: ${{ secrets.ECOWITT_STATION_MAC }}
          # Ajustamos la hora local para que el corte del día sea exacto
          TZ: America/Argentina/Buenos_Aires
        run: |
          mkdir -p data
          python3 scripts/actualizar_mensual.py

      - name: Commit y Push
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add data/*.json
          git commit -m "Clima Chacabuco: Actualización de datos" || echo "Sin cambios"
          git pull --rebase origin main
          git push
name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'data/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Build
        run: |
          # Ajustá este bloque según tu proyecto
          # Si no tenés build, podés dejarlo vacío o borrar este paso
          npm install
          npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist   # Cambiá ./dist por la carpeta donde está tu HTML/JS/CSS

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Actualizar Clima Chacabuco

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch: 

jobs:
  update-weather:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        
      - name: Procesar Datos Actuales
        run: |
          mkdir -p data
          
          # 1. DESCARGAR ORIGINAL
          curl -s -X GET "https://api.ecowitt.net/api/v3/device/real_time?application_key=${{ secrets.ECOWITT_APPLICATION_KEY }}&api_key=${{ secrets.ECOWITT_API_KEY }}&mac=${{ secrets.ECOWITT_STATION_MAC }}&temp_unitid=1&rainfall_unitid=12&wind_speed_unitid=7&solar_irradiance_unitid=16&pressure_unitid=3&capacity_unitid=24&call_back=all" > data/raw.json
          
          # 2. LIMPIAR PRIVACIDAD
          jq '
            .data.outdoor |= del(.vpd) | 
            del(.data.indoor, .data.battery)
          ' data/raw.json > data/latest.json
          
          # 3. ACTUALIZAR SITEMAP
          TIME_UNIX=$(jq -r '.time' data/latest.json)
          if [ -f "sitemap.xml" ]; then
            SITEMAP_DATE=$(TZ="America/Argentina/Buenos_Aires" date -d "@$TIME_UNIX" +"%Y-%m-%dT%H:%M:%S-03:00")
            sed -i "/<loc>https:\/\/maiatec.ar\/clima-chacabuco\/<\/loc>/{n;s|<lastmod>.*</lastmod>|<lastmod>$SITEMAP_DATE</lastmod>|;}" sitemap.xml
          fi

          rm data/raw.json

      - name: Actualizar Historial Mensual (Ecowitt API)
        env:
          APP_KEY: ${{ secrets.ECOWITT_APPLICATION_KEY }}
          API_KEY: ${{ secrets.ECOWITT_API_KEY }}
          MAC: ${{ secrets.ECOWITT_STATION_MAC }}
          TZ: America/Argentina/Buenos_Aires
        run: |
          cat << 'EOF' > actualizar_mensual.py
          import os, requests, json
          from datetime import datetime, timedelta

          APP_KEY = os.environ.get("APP_KEY")
          API_KEY = os.environ.get("API_KEY")
          MAC = os.environ.get("MAC")
          BASE_URL = "https://api.ecowitt.net/api/v3/device/history"

          def clean_hyphens(obj):
              if isinstance(obj, dict):
                  return {k: clean_hyphens(v) for k, v in obj.items()}
              elif isinstance(obj, list):
                  return [clean_hyphens(elem) for elem in obj]
              elif obj == "-":
                  return None
              return obj

          def merge_dicts(dict1, dict2):
              for k, v in dict2.items():
                  if k in dict1 and isinstance(dict1[k], dict) and isinstance(v, dict):
                      merge_dicts(dict1[k], v)
                  else:
                      dict1[k] = v

          def actualizar_mes(start_dt, end_dt):
              start_str = start_dt.strftime("%Y-%m-%d %H:%M:%S")
              end_str = end_dt.strftime("%Y-%m-%d %H:%M:%S")
              
              archivo_mensual = f"data/maiatec_{start_dt.strftime('%Y_%m')}.json"
              archivo_diario_temp = f"data/temp_{start_dt.strftime('%Y%m%d%H%M%S')}.json"

              params = {
                  "application_key": APP_KEY,
                  "api_key": API_KEY,
                  "mac": MAC,
                  "cycle": "5min",
                  "temp_unitid": "1",
                  "rainfall_unitid": "12",
                  "wind_speed_unitid": "7",
                  "solar_irradiance_unitid": "16",
                  "pressure_unitid": "3",
                  "capacity_unitid": "24",
                  "call_back": "outdoor,pressure,rainfall,wind,solar_and_uvi",
                  "start_date": start_str,
                  "end_date": end_str
              }

              try:
                  response = requests.get(BASE_URL, params=params)
                  if response.status_code == 200:
                      data_diaria = response.json()
                      
                      data_diaria = clean_hyphens(data_diaria)
                      
                      if data_diaria.get("code") == 0 and "data" in data_diaria:
                          with open(archivo_diario_temp, 'w', encoding='utf-8') as f:
                              json.dump(data_diaria, f, indent=4, ensure_ascii=False)
                          
                          data_mensual = {"code": 0, "msg": "success", "data": {}}
                          if os.path.exists(archivo_mensual):
                              with open(archivo_mensual, 'r', encoding='utf-8') as f:
                                  try:
                                      data_mensual = json.load(f)
                                  except json.JSONDecodeError:
                                      pass
                          
                          merge_dicts(data_mensual["data"], data_diaria["data"])
                          
                          with open(archivo_mensual, 'w', encoding='utf-8') as f:
                              json.dump(data_mensual, f, indent=4, ensure_ascii=False)
                              
                          os.remove(archivo_diario_temp)
                          print(f"Historial {archivo_mensual} actualizado desde {start_str} hasta {end_str}.")
              except Exception as e:
                  print(f"Hubo un bardo al actualizar {archivo_mensual}: {e}")

          hoy = datetime.now()
          hace_5_horas = hoy - timedelta(hours=5)

          if hoy.month == hace_5_horas.month:
              actualizar_mes(hace_5_horas, hoy)
          else:
              print("¡Opa! Cruzamos de mes, procesando por separado...")
              inicio_mes_actual = hoy.replace(day=1, hour=0, minute=0, second=0, microsecond=0)
              fin_mes_anterior = inicio_mes_actual - timedelta(seconds=1)
              
              actualizar_mes(hace_5_horas, fin_mes_anterior)
              actualizar_mes(inicio_mes_actual, hoy)

          EOF
          
          python3 actualizar_mensual.py
          rm actualizar_mensual.py

      - name: Commit y Push
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add data/latest.json data/maiatec_*.json sitemap.xml
          git commit -m "Clima Chacabuco: Actualización de datos JSON" || echo "Sin cambios"
          git push
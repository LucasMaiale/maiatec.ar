name: Actualizar Clima Chacabuco

on:
  # Dispara desde cron-job 
  schedule:
    - cron: '0 */4 * * *' # Ejecuta cada 4 horas
  workflow_dispatch: 

jobs:
  update-weather:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        
      - name: Procesar Datos y Actualizar Historial
        run: |
          mkdir -p data
          
          # 1. DESCARGAR ORIGINAL
          curl -s -X GET "https://api.ecowitt.net/api/v3/device/real_time?application_key=${{ secrets.ECOWITT_APPLICATION_KEY }}&api_key=${{ secrets.ECOWITT_API_KEY }}&mac=${{ secrets.ECOWITT_STATION_MAC }}&temp_unitid=1&pressure_unitid=3&precip_unitid=13&wind_speed_unitid=7&call_back=all" > data/raw.json
          
          # 2. LIMPIAR PRIVACIDAD Y CONVERTIR TODO EL BLOQUE DE LLUVIA (in a mm)
          jq '
            .data.outdoor |= del(.vpd) | 
            del(.data.indoor, .data.battery) |
            .data.rainfall.rain_rate.value |= (tonumber * 25.4 * 10 | round / 10) | 
            .data.rainfall.rain_rate.unit = "mm/hr" |
            .data.rainfall."1_hour".value |= (tonumber * 25.4 * 10 | round / 10) | 
            .data.rainfall."1_hour".unit = "mm" |
            .data.rainfall.daily.value |= (tonumber * 25.4 * 10 | round / 10) | 
            .data.rainfall.daily.unit = "mm" |
            .data.rainfall.event.value |= (tonumber * 25.4 * 10 | round / 10) | 
            .data.rainfall.event.unit = "mm" |
            .data.rainfall.weekly.value |= (tonumber * 25.4 * 10 | round / 10) | 
            .data.rainfall.weekly.unit = "mm" |
            .data.rainfall.monthly.value |= (tonumber * 25.4 * 10 | round / 10) | 
            .data.rainfall.monthly.unit = "mm" |
            .data.rainfall.yearly.value |= (tonumber * 25.4 * 10 | round / 10) | 
            .data.rainfall.yearly.unit = "mm"
          ' data/raw.json > data/latest.json
          
          # 3. EXTRAER ABSOLUTAMENTE TODO
          TIME_UNIX=$(jq -r '.time' data/latest.json)
          FECHA=$(TZ="America/Argentina/Buenos_Aires" date -d "@$TIME_UNIX" +"%Y-%m-%d %H:%M")
          
          # Formato para el nombre del archivo: 20260615
          CSV_NAME=$(TZ="America/Argentina/Buenos_Aires" date -d "@$TIME_UNIX" +"%Y%m%d")
          CSV_PATH="data/${CSV_NAME}.csv"
          
          # Outdoor
          TEMP=$(jq -r '.data.outdoor.temperature.value' data/latest.json)
          FEELS=$(jq -r '.data.outdoor.feels_like.value' data/latest.json)
          APP=$(jq -r '.data.outdoor.app_temp.value' data/latest.json)
          DEW=$(jq -r '.data.outdoor.dew_point.value' data/latest.json)
          HUM=$(jq -r '.data.outdoor.humidity.value' data/latest.json)
          
          # Solar & UV
          SOLAR=$(jq -r '.data.solar_and_uvi.solar.value' data/latest.json)
          UVI=$(jq -r '.data.solar_and_uvi.uvi.value' data/latest.json)
          
          # Pressure
          PRES_REL=$(jq -r '.data.pressure.relative.value' data/latest.json)
          PRES_ABS=$(jq -r '.data.pressure.absolute.value' data/latest.json)
          
          # Wind
          W_SPEED=$(jq -r '.data.wind.wind_speed.value' data/latest.json)
          W_GUST=$(jq -r '.data.wind.wind_gust.value' data/latest.json)
          W_DIR=$(jq -r '.data.wind.wind_direction.value' data/latest.json)
          
          # Rainfall (Todas las métricas ya en mm)
          R_RATE=$(jq -r '.data.rainfall.rain_rate.value' data/latest.json)
          R_1H=$(jq -r '.data.rainfall."1_hour".value' data/latest.json)
          R_DAY=$(jq -r '.data.rainfall.daily.value' data/latest.json)
          R_EVE=$(jq -r '.data.rainfall.event.value' data/latest.json)
          R_WEE=$(jq -r '.data.rainfall.weekly.value' data/latest.json)
          R_MON=$(jq -r '.data.rainfall.monthly.value' data/latest.json)
          R_YEA=$(jq -r '.data.rainfall.yearly.value' data/latest.json)

          # 4. ACTUALIZAR CSV DIARIO (Encabezado Completo)
          if [ ! -f "$CSV_PATH" ]; then
            echo "Fecha,Temp(C),SensTerm(C),TempApar(C),PtoRocio(C),Hum(%),Solar(Wm2),UV,PresRel(hPa),PresAbs(hPa),Viento(kmh),Rafaga(kmh),Dir(deg),Lluvia_Intens(mmh),Lluvia_1h(mm),Lluvia_Dia(mm),Lluvia_Ev(mm),Lluvia_Sem(mm),Lluvia_Mes(mm),Lluvia_Anio(mm)" > "$CSV_PATH"
          fi
          echo "$FECHA,$TEMP,$FEELS,$APP,$DEW,$HUM,$SOLAR,$UVI,$PRES_REL,$PRES_ABS,$W_SPEED,$W_GUST,$W_DIR,$R_RATE,$R_1H,$R_DAY,$R_EVE,$R_WEE,$R_MON,$R_YEA" >> "$CSV_PATH"

          # 6. ACTUALIZAR SITEMAP EN LA RAIZ (Hora actual en formato W3C)
          if [ -f "sitemap.xml" ]; then
            SITEMAP_DATE=$(TZ="America/Argentina/Buenos_Aires" date -d "@$TIME_UNIX" +"%Y-%m-%dT%H:%M:%S-03:00")
            sed -i "/<loc>https:\/\/maiatec.ar\/clima-chacabuco\/<\/loc>/{n;s|<lastmod>.*</lastmod>|<lastmod>$SITEMAP_DATE</lastmod>|;}" sitemap.xml
          fi

          rm data/raw.json

      - name: Actualizar Historial Mensual (Ecowitt API)
        env:
          # Pasamos los secretos como variables para que Python los consuma
          APP_KEY: ${{ secrets.ECOWITT_APPLICATION_KEY }}
          API_KEY: ${{ secrets.ECOWITT_API_KEY }}
          MAC: ${{ secrets.ECOWITT_STATION_MAC }}
          # Ajustamos la hora local para que el corte del día sea exacto
          TZ: America/Argentina/Buenos_Aires
        run: |
          cat << 'EOF' > actualizar_mensual.py
          import os, requests, json
          from datetime import datetime

          APP_KEY = os.environ.get("APP_KEY")
          API_KEY = os.environ.get("API_KEY")
          MAC = os.environ.get("MAC")
          BASE_URL = "https://api.ecowitt.net/api/v3/device/history"

          # Función para limpiar los guiones que manda Ecowitt cuando no hay datos
          def clean_hyphens(obj):
              if isinstance(obj, dict):
                  return {k: clean_hyphens(v) for k, v in obj.items()}
              elif isinstance(obj, list):
                  return [clean_hyphens(elem) for elem in obj]
              elif obj == "-":
                  return None
              return obj

          def merge_dicts(dict1, dict2):
              for k, v in dict2.items():
                  if k in dict1 and isinstance(dict1[k], dict) and isinstance(v, dict):
                      merge_dicts(dict1[k], v)
                  else:
                      dict1[k] = v

          hoy = datetime.now()
          start_str = hoy.strftime("%Y-%m-%d 00:00:00")
          end_str = hoy.strftime("%Y-%m-%d 23:59:59")

          # Guardamos todo prolijo dentro de la carpeta 'data'
          archivo_mensual = f"data/maiatec_{hoy.strftime('%Y_%m')}.json"
          archivo_diario_temp = f"data/temp_{hoy.strftime('%Y%m%d')}.json"

          params = {
              "application_key": APP_KEY,
              "api_key": API_KEY,
              "mac": MAC,
              "cycle": "5min",
              "temp_unitid": "1",
              "rainfall_unitid": "12",
              "wind_speed_unitid": "7",
              "solar_irradiance_unitid": "16",
              "pressure_unitid": "3",
              "capacity_unitid": "24",
              "call_back": "outdoor,pressure,rainfall,wind,solar_and_uvi",
              "start_date": start_str,
              "end_date": end_str
          }

          try:
              response = requests.get(BASE_URL, params=params)
              if response.status_code == 200:
                  data_diaria = response.json()
                  
                  # Limpiamos los guiones pasándolos a nulo antes de procesar
                  data_diaria = clean_hyphens(data_diaria)
                  
                  if data_diaria.get("code") == 0 and "data" in data_diaria:
                      # 1. Guardamos el temporal diario
                      with open(archivo_diario_temp, 'w', encoding='utf-8') as f:
                          json.dump(data_diaria, f, indent=4, ensure_ascii=False)
                      
                      # 2. Leemos el mensual o lo creamos de cero
                      data_mensual = {"code": 0, "msg": "success", "data": {}}
                      if os.path.exists(archivo_mensual):
                          with open(archivo_mensual, 'r', encoding='utf-8') as f:
                              try:
                                  data_mensual = json.load(f)
                              except json.JSONDecodeError:
                                  pass
                      
                      # 3. Fusionamos los datos sin duplicar
                      merge_dicts(data_mensual["data"], data_diaria["data"])
                      
                      # 4. Guardamos el mensual actualizado
                      with open(archivo_mensual, 'w', encoding='utf-8') as f:
                          json.dump(data_mensual, f, indent=4, ensure_ascii=False)
                          
                      # 5. Volamos el archivo temporal
                      os.remove(archivo_diario_temp)
                      print(f"Historial {archivo_mensual} actualizado joya.")
          except Exception as e:
              print(f"Hubo un bardo: {e}")
          EOF
          
          # Ejecutamos el script y limpiamos la evidencia
          python3 actualizar_mensual.py
          rm actualizar_mensual.py

      - name: Commit y Push
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          # Le agregamos el patrón para que agarre los JSON mensuales nuevos
          git add data/latest.json data/*.csv data/maiatec_*.json sitemap.xml
          git commit -m "Clima Chacabuco: Actualización de datos, CSV y mensual" || echo "Sin cambios"
          # git pull --rebase origin main
          git push